<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/webdev-logo.png" />
    <!-- Rubik is self-hosted (src/fonts.css) — the Google Fonts stylesheet was
         render-blocking ~760 ms on mobile. Only the upright face is preloaded:
         italics are rare and below the fold. -->
    <link
      rel="preload"
      href="/fonts/rubik-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="geo.region" content="MA-01" />
    <meta name="geo.placename" content="Casablanca, Maroc" />
    <meta name="geo.position" content="33.589886;-7.603869" />
    <meta name="ICBM" content="33.589886, -7.603869" />
    <meta
      name="google-site-verification"
      content="GSLrbqHnjWZMKUIlPpQERLlx4TvXZdxOKerDn43HJqo"
    />
    <!-- No hero preload here: this file is the shell of every route, so a global
         preload made city pages fetch the homepage hero ahead of their own. Each
         page's hero <img> carries fetchpriority="high" instead. -->
    <title>
      Création Site Web Casablanca | Développeur Web Freelance Maroc
    </title>
    <!-- Per-route SEO/social tags (description, canonical, og:title/description/url/type,
         twitter:title/description) are set per page by react-helmet-async and baked into each
         route's HTML at prerender time. Only global constants live here, to avoid duplicate /
         conflicting tags (e.g. two canonicals) in the prerendered output. The <title> below is
         a fallback only — react-helmet replaces it on every route. -->
    <!-- og:image, og:image:alt and og:locale are set per page, with defaults in
         AppLayout (Helmet dedupes them; tags here would be duplicated instead).
         Every share image is a 1200×630 JPG, so the size is a global constant. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="google-site-verification"
      content="q3OyPfz5JXnd1xxaLvBe4n5QqONuxHuUzpPjIB10pZ0"
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-18032730547"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Production only: `npm run dev` / `vite preview` would otherwise send
      // page_views (and Ads conversions) from localhost into GA4 and Ads.
      if (location.hostname === "www.moudevpro.com") {
        gtag("config", "AW-18032730547");
        gtag("config", "G-P7F2509ZQF");
      }
    </script>

    <!-- Event snippet for Contact-from-moudev conversion page
In your html page, add the snippet and call gtag_report_conversion when someone clicks on the chosen link or button. -->
    <script>
      function gtag_report_conversion(url) {
        // Navigate once: on the hit's callback, or after 1 s if it never comes
        // (gtag.js blocked by an ad blocker, or no tag configured on localhost)
        // — otherwise the WhatsApp button silently does nothing.
        var done = false;
        var callback = function () {
          if (done) return;
          done = true;
          if (typeof url != "undefined") {
            window.location = url;
          }
        };
        gtag("event", "conversion", {
          send_to: "AW-18032730547/abRzCJSdzKUcELPD1pZD",
          event_callback: callback,
        });
        setTimeout(callback, 1000);
        return false;
      }
    </script>
  </head>
  <body>
    <!-- No noscript fallback: every route is prerendered with its full content,
         and a shared fallback put homepage (Casablanca) copy at the top of every
         page's HTML, including /marrakech and /usa. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
